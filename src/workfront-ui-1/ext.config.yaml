operations:
  view:
    - type: web
      impl: index.html
web: web-src
actions: actions
runtimeManifest:
  packages:
    workfront-ui-1:
      license: Apache-2.0
      actions:
        get-projects:
          function: actions/get-projects/index.js
          web: 'yes'
          runtime: 'nodejs:22'
          annotations:
            require-adobe-auth: false
            final: true
        get-project:
          function: actions/get-project/index.js
          web: 'yes'
          runtime: 'nodejs:22'
          annotations:
            require-adobe-auth: false
            final: true
        get-project-comments:
          function: actions/get-project-comments/index.js
          web: 'yes'
          runtime: 'nodejs:22'
          annotations:
            require-adobe-auth: false
            final: true
        get-project-documents:
          function: actions/get-project-documents/index.js
          web: 'yes'
          runtime: 'nodejs:22'
          annotations:
            require-adobe-auth: false
            final: true
        get-custom-documents:
          function: actions/get-custom-documents/index.js
          web: 'yes'
          runtime: 'nodejs:22'
          annotations:
            require-adobe-auth: false
            final: true
        get-document-thumbnail:
          function: actions/get-document-thumbnail/index.js
          web: 'yes'
          runtime: 'nodejs:22'
          annotations:
            require-adobe-auth: false
            final: true
        upload-project-document:
          function: actions/upload-project-document/index.js
          web: 'yes'
          runtime: 'nodejs:22'
          limits:
            timeout: 600000
            memory: 256
          annotations:
            require-adobe-auth: false
            final: true
        transfer-project-document:
          function: actions/transfer-project-document/index.js
          web: 'no'
          runtime: 'nodejs:22'
          limits:
            timeout: 600000
            memory: 256
        cleanup-document-uploads:
          function: actions/cleanup-document-uploads/index.js
          web: 'no'
          runtime: 'nodejs:22'
          limits:
            timeout: 300000
        bulk-download-documents:
          function: actions/bulk-download-documents/index.js
          web: 'yes'
          runtime: 'nodejs:22'
          annotations:
            require-adobe-auth: false
            final: true
        get-project-statuses:
          function: actions/get-project-statuses/index.js
          web: 'yes'
          runtime: 'nodejs:22'
          annotations:
            require-adobe-auth: false
            final: true
        get-project-journal:
          function: actions/get-project-journal/index.js
          web: 'yes'
          runtime: 'nodejs:22'
          annotations:
            require-adobe-auth: false
            final: true
        get-object-name:
          function: actions/get-object-name/index.js
          web: 'yes'
          runtime: 'nodejs:22'
          annotations:
            require-adobe-auth: false
            final: true
      triggers:
        cleanup-document-uploads-hourly:
          feed: /whisk.system/alarms/interval
          inputs:
            minutes: 60
      rules:
        cleanup-document-uploads-schedule:
          trigger: cleanup-document-uploads-hourly
          action: cleanup-document-uploads
hooks:
  pre-app-run: node node_modules/@adobe/uix-guest/scripts/generate-metadata.js
  pre-app-build: node node_modules/@adobe/uix-guest/scripts/generate-metadata.js
  post-app-deploy: ./hooks/post-deploy.js
